<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOTP 2FA </title>
<style>
:root {
  --bg: #ffffff;
  --text-main: #1f2937;
  --text-sub: #4b5563;
  --card-bg: #f3f4f6;
  --border-color: #ddd;
  --primary:#2563eb;
  --danger:#ef4444;
  --success:#16a34a;
}
[data-theme="dark"] {
  --bg: #111827;
  --text-main: #f3f4f6;
  --text-sub: #d1d5db;
  --card-bg: #1f2937;
  --border-color: #374151;
  --primary:#3b82f6;
  --danger:#f87171;
  --success:#22c55e;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111827;
    --text-main: #f3f4f6;
    --text-sub: #d1d5db;
    --card-bg: #1f2937;
    --border-color: #374151;
    --primary:#3b82f6;
    --danger:#f87171;
    --success:#22c55e;
  }
}
*{box-sizing:border-box;font-family:system-ui, -apple-system, sans-serif}
body{
  max-width:480px;
  margin:1.5rem auto;
  padding:0 0.8rem;
  background-color: var(--bg);
  color: var(--text-main);
  transition: background 0.3s, color 0.3s;
}
.header-wrap {
  max-width:480px;
  margin:0 auto 14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap: 12px;
}
h2{margin:0;font-size:1.4rem;}
h3{margin:0 0 8px 0;font-size:1.1rem;}
.card{
  background:var(--card-bg);
  padding:20px;
  border-radius:16px;
  box-shadow:0 4px 16px rgba(0,0,0,0.12);
  margin-bottom:14px;
}
input,select{
  width:100%;
  padding:12px 14px;
  margin:6px 0;
  border:1px solid var(--border-color);
  border-radius:10px;
  font-size:16px;
  background:var(--card-bg);
  color:var(--text-main);
}
button{
  padding:12px 14px;
  border:none;
  border-radius:10px;
  background:var(--primary);
  color:#fff;
  cursor:pointer;
  margin:4px;
  font-size:15px;
  transition:0.2s;
  min-height:44px;
}
button:hover{opacity:0.85;}
.btn-del{background:var(--danger);}
.btn-success{background:var(--success);}
#code{
  font-size:clamp(32px,8vw,40px);
  font-weight:bold;
  letter-spacing:6px;
  margin:14px 0;
  text-align:center;
}
#progress{
  height:7px;
  background:var(--border-color);
  border-radius:4px;
  overflow:hidden;
  margin-bottom:16px;
}
#bar{
  height:100%;
  background:var(--primary);
  width:100%;
  transition: linear 1s;
}
.row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}
.row select{
  flex:1 1 110px;
}
.item{
  border:1px solid var(--border-color);
  border-radius:10px;
  padding:12px;
  margin:8px 0;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}
.item-code{
  font-size:clamp(22px,6vw,26px);
  font-weight:bold;
  letter-spacing:4px;
}
.btn-group{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin:8px 0;
}
.hidden-input{
  display:none;
}
.tip-text{
  font-size:13px;
  color:var(--text-sub);
  margin:6px 4px;
}
</style>
</head>
<body>
<div class="header-wrap">
  <h2>TOTP 2FA</h2>
  <theme-button value="light" id="btn" size="1.2"></theme-button>
</div>
<div class="card">
  <div id="progress"><div id="bar"></div></div>
  <input id="secret" placeholder="填入Base32密钥" value="">
  <input id="name" placeholder="账户名称（例如 Github）">
  <div class="row">
    <select id="hashAlg">
      <option value="SHA-1">SHA‑1 (默认)</option>
      <option value="SHA-256">SHA‑256</option>
    </select>
    <select id="digits">
      <option value="6">6位</option>
      <option value="8">8位</option>
    </select>
    <select id="step">
      <option value="30">30秒</option>
      <option value="60">60秒</option>
    </select>
  </div>
  <div class="btn-group">
    <button onclick="addItem()">保存账户</button>
  </div>
  <div id="code">------</div>
  <button onclick="copyCode()">复制验证码</button>
</div>
<div class="card">
  <h3>已保存列表</h3>
  <div class="btn-group">
    <button onclick="exportBackup()">导出备份</button>

  </div>
  <div class="tip-text">忘记加密密码，备份文件将无法恢复</div>

async function passToKey(password, salt) {
  const enc = new TextEncoder();
  const raw = await crypto.subtle.importKey("raw", enc.encode(password), { name: "PBKDF2" }, false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" },
    raw,
    { name: "AES‑GCM", length: 256 },
    false,
    ["encrypt", "decrypt"]
  );
}
async function encryptData(plainObj, password) {
  const enc = new TextEncoder();
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await passToKey(password, salt);
  const plainText = JSON.stringify(plainObj);
  const encrypted = await crypto.subtle.encrypt({ name: "AES‑GCM", iv: iv }, key, enc.encode(plainText));
  return {
    salt: Array.from(salt),
    iv: Array.from(iv),
    data: Array.from(new Uint8Array(encrypted))
  };
}
async function decryptData(encryptObj, password) {
  const salt = new Uint8Array(encryptObj.salt);
  const iv = new Uint8Array(encryptObj.iv);
  const data = new Uint8Array(encryptObj.data);
  const key = await passToKey(password, salt);
  try {
    const decBuf = await crypto.subtle.decrypt({ name: "AES‑GCM", iv: iv }, key, data);
    const decText = new TextDecoder().decode(decBuf);
    return JSON.parse(decText);
  } catch (e) {
    return null;
  }
}
//主程序
const B32CHARS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
let currentCode = "";
function base32Decode(s){
  s = s.toUpperCase().replace(/[^A-Z2-7]/g,"");
  let bits = "", out = [];
  for(let c of s) bits += B32CHARS.indexOf(c).toString(2).padStart(5,"0");
  for(let i=0;i+7<bits.length;i+=8) out.push(parseInt(bits.substr(i,8),2));
  return Uint8Array.from(out);
}
async function getHmac(keyBuf, hashAlg, dataBuf){
  const k = await crypto.subtle.importKey("raw", keyBuf, {name:"HMAC",hash:hashAlg}, false, ["sign"]);
  const sig = await crypto.subtle.sign("HMAC",k,dataBuf);
  return new Uint8Array(sig);
}
async function calcTOTP(base32secret, hashAlg, digits, stepSec){
  const key = base32Decode(base32secret);
  const now = Math.floor(Date.now()/1000);
  const counter = Math.floor(now / stepSec);
  const rem = now % stepSec;
  const cBuf = new ArrayBuffer(8);
  new DataView(cBuf).setBigUint64(0, BigInt(counter), false);
  const hmac = await getHmac(key, hashAlg, new Uint8Array(cBuf));
  const offset = hmac[hmac.length-1] & 0x0f;
  const bin = ((hmac[offset]&0x7f)<<24) | (hmac[offset+1]<<16) | (hmac[offset+2]<<8) | hmac[offset+3];
  const mod = Math.pow(10, digits);
  const code = String(bin % mod).padStart(digits,"0");
  return {code, remain: stepSec - rem};
}
async function update(){
  const sec = document.getElementById("secret").value.trim();
  const hashAlg = document.getElementById("hashAlg").value;
  const digits = Number(document.getElementById("digits").value);
  const stepSec = Number(document.getElementById("step").value);
  const codeDom = document.getElementById("code");
  const bar = document.getElementById("bar");
  if(!sec){
    codeDom.textContent="------";
    currentCode="";
    return;
  }
  try{
    const res = await calcTOTP(sec, hashAlg, digits, stepSec);
    codeDom.textContent = res.code;
    currentCode = res.code;
    bar.style.width = (res.remain / stepSec *100)+"%";
  }catch{
    codeDom.textContent = "密钥错误";
    currentCode="";
  }
  renderList();
}
function copyCode(){
  if(currentCode) navigator.clipboard.writeText(currentCode);
}
function getList(){
  const raw = localStorage.getItem("totp_list");
  return raw ? JSON.parse(raw) : [];
}
function saveList(arr){
  localStorage.setItem("totp_list", JSON.stringify(arr));
}
function addItem(){
  const name = document.getElementById("name").value.trim();
  const secret = document.getElementById("secret").value.trim();
  const hashAlg = document.getElementById("hashAlg").value;
  const digits = +document.getElementById("digits").value;
  const stepSec = +document.getElementById("step").value;
  if(!secret)return;
  const arr = getList();
  arr.push({name,secret,hashAlg,digits,stepSec});
  saveList(arr);
  renderList();
}
//加密导出
async function exportBackup() {
  const data = getList();
  if(data.length === 0){
    alert("暂无账号，无法导出");
    return;
  }
  const pwd = prompt("设置备份加密密码\n忘记密码备份将永久无法恢复！");
  if(pwd === null || pwd.trim() === "") return;
  try {
    const encryptResult = await encryptData(data, pwd.trim());
    const blob = new Blob([JSON.stringify(encryptResult,null,2)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "totp‑encrypted‑backup.json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(a.href);
    alert("加密备份已下载！务必记住加密密码！");
  }catch(err){
    alert("导出加密失败："+err.message);
    console.error(err);
  }
}
//导入备份
async function importBackup(inputEl){
  const file = inputEl.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async function(e){
    try{
      const fileJson = JSON.parse(e.target.result);
      
      if(!(fileJson.salt && fileJson.iv && fileJson.data)){
        alert("不是有效的加密备份文件");
        inputEl.value = "";
        return;
      }
      const pwd = prompt("输入备份的密码");
      if(pwd === null || pwd.trim() === ""){
        inputEl.value = "";
        return;
      }
      const realData = await decryptData(fileJson, pwd.trim());
      if(!realData){
        alert("密码错误或文件损坏");
        inputEl.value = "";
        return;
      }
      if(!Array.isArray(realData)) throw new Error("格式错误");
      for(let item of realData){
        if(!item.secret) throw new Error("字段缺失");
      }
      const old = getList();
      const merge = [...old, ...realData];
      saveList(merge);
      alert(`成功导入 ${realData.length} 条账号`);
      renderList();
    }catch(err){
      alert("导入失败，文件损坏或者不是备份文件");
      console.error(err);
    }
    inputEl.value = "";
  };
  reader.readAsText(file);
}
async function renderList(){
  const wrap = document.getElementById("listWrap");
  const arr = getList();
  wrap.innerHTML = "";
  for(let idx=0;idx<arr.length;idx++){
    const item = arr[idx];
    let codeText = "----";
    try{
      const r = await calcTOTP(item.secret, item.hashAlg, item.digits, item.stepSec);
      codeText = r.code;
    }catch(e){}
    const div = document.createElement("div");
    div.className="item";
    div.innerHTML=`
      <div style="flex:1">
        <div>${item.name||"未命名"}</div>
        <div class="item-code">${codeText}</div>
      </div>
      <button class="btn-del" data-i="${idx}">删除</button>
    `;
    wrap.appendChild(div);
  }
  document.querySelectorAll(".btn-del").forEach(b=>{
    b.onclick=(e)=>{
      const i = Number(e.target.dataset.i);
      const a = getList();
      a.splice(i,1);
      saveList(a);
      renderList();
    }
  })
}
document.getElementById("hashAlg").addEventListener("change",update);
document.getElementById("digits").addEventListener("change",update);
document.getElementById("step").addEventListener("change",update);
update();
setInterval(update,1000);
</script>
